[project]
name = "udacenture-salesops-agent"
version = "0.1.0"
description = "A locally operationalized SalesOps agent"
requires-python = ">=3.13"
dependencies = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph>=1.0,<2", "pydantic>=2.0,<3", "python-dotenv>=1.0,<2", "pyyaml>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
salesops-agent = "salesops_agent.cli:main"
evaluate = "salesops_agent.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
